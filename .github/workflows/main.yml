name: Karate API Tests (Java 17)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de Karate a ejecutar (ej. @smoke, @regression, @dummy)"
        required: true
        default: "@smoke"
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-karate-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Run Karate tests by tag
        env:
          KARATE_TAG: ${{ inputs.tag || '@smoke' }}
          KARATE_ENV: "dev"
        run: >
          mvn test
          -Dkarate.env="${KARATE_ENV}"
          -Dkarate.options="--tags ${KARATE_TAG}"

      - name: Upload Karate & Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports-${{ inputs.tag || 'default' }}
          path: |
            target/karate-reports/
            target/surefire-reports/
          retention-days: 7
